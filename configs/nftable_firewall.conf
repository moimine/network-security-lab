#!/usr/sbin/nft -f

flush ruleset

define LOOPBACK = "lo"
define WAN = "enp6s0" # $LAN
define ADMIN = "enp5s0.10" 
define USERS = "enp5s0.20" 
define SERVERS = "enp5s0.30" 
define DMZ = "enp5s0.40" 
define DNS = 10.114.22.3
define DHCP = 10.114.22.2 
define LAN_ADDR = 10.114.22.0/24 
define DHCP_SERVER_LISTEN_PORT = 67
define DHCP_CLIENT_LISTEN_PORT = 68
define DNS_LISTEN_PORT = 53
define WAZUH = 10.114.22.10
define WAZUH_PORTS = {1514,1515}


table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iifname $LOOPBACK accept
        ct state established,related accept
        ct state invalid drop
        udp dport $DHCP_SERVER_LISTEN_PORT iifname {$ADMIN,$USERS,$SERVERS,$DMZ} accept
        udp dport $DHCP_CLIENT_LISTEN_PORT iifname $WAN accept
        icmp type echo-request iifname {$ADMIN,$USERS,$SERVERS,$DMZ} accept
	icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        
        # Connexion's rules
        ct state established,related accept
        ct state invalid drop

        # VLAN 10
        iifname $ADMIN accept 

        # VLAN 20
        iifname $USERS ip daddr $DNS udp dport $DNS_LISTEN_PORT accept
        iifname $USERS ip daddr $DNS tcp dport $DNS_LISTEN_PORT accept
	    iifname $USERS ip daddr $WAZUH tcp dport $WAZUH_PORTS counter accept
        iifname $USERS oifname $ADMIN counter reject 
        iifname $USERS oifname $SERVERS accept 
        iifname $USERS oifname $DMZ drop 
        iifname $USERS oifname $WAN accept 

        # VLAN 30
        iifname $SERVERS ip daddr $DNS udp dport $DNS_LISTEN_PORT accept
        iifname $SERVERS ip daddr $DNS tcp dport $DNS_LISTEN_PORT accept        
        iifname $SERVERS oifname $ADMIN reject 
        iifname $SERVERS oifname $USERS reject 
        iifname $SERVERS oifname $DMZ drop 
        iifname $SERVERS oifname $WAN accept 

        # VLAN 40
        # iifname $DMZ ip daddr $DNS drop # Désactivé pour effectué des tests 
        iifname $DMZ ip daddr $DNS udp dport $DNS_LISTEN_PORT accept
        iifname $DMZ ip daddr $DNS tcp dport $DNS_LISTEN_PORT accept 
        iifname $DMZ oifname {$ADMIN,$USERS,$SERVERS} drop 
        iifname $DMZ oifname $WAN accept 
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $LAN_ADDR masquerade
    }
}

