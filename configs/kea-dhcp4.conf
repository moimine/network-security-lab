{
 "Dhcp4": {
    // Interface réseau sur laquelle le service DHCP doit être en écoute
    "interfaces-config": {
        "interfaces": [ "eth0" ],
	"dhcp-socket-type": "raw"
    },

    // Durée des baux DHCP (bail de 8 jours, renouvelable à partir de 4 jours)
    "valid-lifetime": 691200,
    "renew-timer": 345600,
    "rebind-timer": 604800,

    // Serveur DHCP principal sur ce réseau local
    "authoritative": true,

    // Configuration de la base des baux DHCP
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv",
        "lfc-interval": 3600
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.114.22.0/26",
        "pools": [ { "pool": "10.114.22.10 - 10.114.22.62" } ],
        "option-data": [
          { "name": "domain-name-servers", "data": "10.114.22.3" },
          { "name": "domain-search", "data": "homelab.local" },
          { "name": "routers", "data": "10.114.22.1" }
        ],
        "reservations": [
          {
            "hw-address": "10:66:6a:bc:40:76",
